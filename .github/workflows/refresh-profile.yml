name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate profile cards
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
      - name: Commit updated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/header.svg assets/header-mobile.svg assets/github.svg assets/github-mobile.svg assets/steam.svg assets/steam-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile snapshots'
            git push
          fi
